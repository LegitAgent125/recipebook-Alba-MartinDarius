{% extends 'base.html' %}

    {% block title %} Recipe Addition {% endblock %}

    {% block content%}
        {% if request.user.is_authenticated %}
            <h1>Add a New Recipe</h1>
            <form method="POST">
                {% csrf_token %}
                {{ form }}
                <button type="submit">
                    Save Recipe
                </button>
            </form>

            <a href="{% url 'ledger:recipes/list' %}"> Back to Recipes </a>
        {% endif %}
{% endblock %}
