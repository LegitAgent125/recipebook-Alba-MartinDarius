{% extends 'base.html' %}

{% block title %} Password Reset Form {% endblock %}

{% block content %}
    {% if form.errors %}
        {% for field in form %}
            {% for error in field.errors %}
                {{ error }} 
            {% endfor %}
        {% endfor %}
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Request Password Reset Link
        </button>
    </form>
{% endblock %}
